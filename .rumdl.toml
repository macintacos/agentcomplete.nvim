# rumdl config — scaffolded with `rumdl init`, then customized. rumdl lints AND
# formats Markdown (one tool): `rumdl check` lints, `rumdl fmt` formats; hk drives
# both via Builtins.rumdl. This is a per-project file — deploy it into the repo as
# `.rumdl.toml` (leading dot). Reference: https://rumdl.dev
[global]
# Recommended baseline disables: MD013 (line length), MD033 (inline HTML),
# MD034 (bare URLs). Opt-in rules (MD060, …) stay off unless added to extend-enable.
disable = ["MD013", "MD033", "MD034"]

# Respect .gitignore when scanning directories (rumdl init default).
respect-gitignore = true

# Patterns rumdl skips (rumdl init defaults).
exclude = [
  ".git",
  ".github",
  "node_modules",
  "vendor",
  "dist",
  "build",
  "CHANGELOG.md",
  "LICENSE.md",
]

[MD024]
# Only flag duplicate headings that are siblings (share a parent), not across the
# whole document. (This is also rumdl's default; kept explicit.)
siblings-only = true
