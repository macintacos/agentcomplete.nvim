[settings]
# Commit mise.lock for reproducible, checksum-pinned tool versions.
lockfile = true

# The npm backend (npm:oxfmt) installs through the bun pinned below. Left unset it
# resolves from the developer's own mise config, which on a machine without that
# setting falls back to a host npm — and so a host Node this repo never pins.
[settings.npm]
package_manager = "bun"

# HK_MISE routes hk's git-hook subprocesses through `mise x`, so each hook step
# uses the versions pinned below — even for committers who never activated mise.
[env]
HK_MISE = 1

[tools]
# hk evaluates hk.pkl with its built-in evaluator; the pkl CLI runs only the
# Pkl(Format) / Pkl(Lint) steps (`pkl format` and `pkl eval`).
hk  = "latest"
pkl = "latest"

# Cross-language baseline — recommended in every project.
"aqua:google/yamlfmt" = "latest" # YAML format
taplo                 = "latest" # TOML format + lint (config in taplo.toml)
shellcheck            = "latest" # Shell lint
shfmt                 = "latest" # Shell format
rumdl                 = "latest" # Markdown lint + format (config in .rumdl.toml)

# Lua toolchain for the Neovim plugin.
stylua                    = "latest" # Lua format (config in stylua.toml)
"aqua:Kampfkarren/selene" = "latest" # Lua lint hygiene (config in selene.toml)
lua-language-server       = "latest" # LuaCATS type-check (config in .luarc.json)
neovim                    = "latest" # headless test runtime (mini.test)

# TypeScript toolchain for the OpenCode plugin (opencode/).
bun         = "latest" # package manager for opencode/ (bun install)
oxlint      = "latest" # TypeScript lint
"npm:oxfmt" = "latest" # TypeScript format

# README demo (assets/demo.tape, `mise run demo`). vhs also needs ttyd and ffmpeg on
# $PATH, which mise can't install on macOS — take them from your OS package manager.
"aqua:charmbracelet/vhs" = "latest" # terminal recorder

# (Re)register git hooks whenever tools are installed or updated.
[hooks]
postinstall = "hk install --mise"
